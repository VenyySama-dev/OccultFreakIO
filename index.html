<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All seeing eye</title>
  
  <!-- ARG Clues & Hidden Metadata -->
  <meta name="clue-frequency" content="142.857 MHz">
  <meta name="tape-date" content="2008-11-04">
  <meta name="coordinates" content="37.2431 N, 115.7930 W">
  <meta name="description" content="All seeing eye. Archive 2008.">

  <!-- Gritty 2008 Typewriter & Retro Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=VT323&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Dynamic Background Layer (Configurable easily in style.css or script.js) -->
  <div id="bg-layer" class="bg-layer" aria-hidden="true"></div>

  <!-- Animated Analog Noise & Grime Canvas -->
  <canvas id="noise-canvas" class="noise-canvas" aria-hidden="true"></canvas>

  <!-- 2008 Camcorder / Horror HUD -->
  <header class="hud-top">
    <div class="rec-indicator">
      <span class="rec-dot"></span>
      <span class="rec-text">REC [00:04:18]</span>
    </div>
    <div class="tape-meta">
      <button id="sound-btn" class="hud-btn" type="button" title="Toggle audio">[ audio: muted ]</button>
    </div>
  </header>

  <!-- Main Simple Horror Focus -->
  <main class="horror-container">
    
    <!-- Unsettling Staring Eye Glyph -->
    <div class="eye-symbol" id="eye-container" aria-hidden="true">
      <svg viewBox="0 0 120 70" width="110" height="65" class="eye-svg">
        <!-- Eerie simple eye outline -->
        <path d="M 10 35 Q 60 5 110 35 Q 60 65 10 35 Z" class="eye-shape" />
        <!-- Iris & Dilated Pupil -->
        <g id="pupil-group">
          <circle cx="60" cy="35" r="15" class="iris-circle" />
          <circle cx="60" cy="35" r="7" class="pupil-circle" />
          <circle cx="58" cy="33" r="2" class="glint-circle" />
        </g>
      </svg>
    </div>

    <!-- Mandatory Text: "All seeing eye" -->
    <h1 class="horror-title" id="horror-title">All seeing eye</h1>

    <!-- Simple Password Form -->
    <form id="password-form" class="simple-password-form" autocomplete="off" spellcheck="false">
      <div class="input-box-row">
        <span class="prompt-arrow">&gt;</span>
        <input 
          type="text" 
          id="password-input" 
          class="simple-password-input" 
          placeholder="enter password..." 
          autocomplete="off" 
          autocapitalize="off" 
          autofocus 
          required 
        />
        <button type="submit" id="submit-btn" class="simple-submit-btn">[ submit ]</button>
      </div>
    </form>

    <!-- Raw Terminal Response -->
    <div id="output-log" class="output-log" aria-live="polite">
      <div class="log-line init">&gt; waiting for input...</div>
    </div>

  </main>

  <!-- VHS Tracking Bottom Timestamp -->
  <footer class="hud-bottom">
    <span class="vhs-timestamp" id="vhs-timestamp">2008-11-04 03:14:21 AM</span>
    <span class="vhs-sp">SP // NTSC</span>
  </footer>

  <!-- 
    ARG CLUE FOR PLAYERS:
    Coordinates: 37.2431 N, 115.7930 W
    Frequency: 142.857 MHz
    Passwords in script.js: "eye", "ouroboros", "freak"
  -->
  <script src="script.js"></script>
</body>
</html>
